/* ═══════════════ М3: КЕЙСЫ ═══════════════
   Список с тирами и таймерами сгорания → полноэкранная рулетка по канону
   (горизонтальный реел под фиксированным маркером, разгон → долгое
   торможение → микро-докат, только transform/opacity) → экран приза с
   конфетти и count-up. Дроп решает ТОЛЬКО сервер (crypto/rand) — реел
   лишь театр вокруг готового результата; красный отдан top-tier дропу.
   Хаптика: navigator.vibrate на тики и дроп — Android only (на iOS API
   нет), за настройкой «выкл» в Прогрессе (RESEARCH §1). */
let cases = [], caseOpening = null, reelRaf = 0;

const TIER = {
  light: {c: 'var(--t-light)', em: '◇'}, medium: {c: 'var(--t-medium)', em: '◈'},
  heavy: {c: 'var(--t-heavy)', em: '◆'}, titan: {c: 'var(--t-titan)', em: '✦'},
  gods: {c: 'var(--t-gods)', em: '★'},
};
/* диапазоны монет по тирам — ТОЛЬКО театр реела (истина на сервере) */
const CASE_CFG = {light: [50, 200], medium: [200, 600], heavy: [500, 2000], titan: [1000, 5000], gods: [5000, 20000]};
const JACKPOT = 50000;
const CONF_N = {light: 24, medium: 36, heavy: 54, titan: 80, gods: 120};
const DROP_VIB = {light: [24], medium: [32], heavy: [18, 30, 48], titan: [18, 30, 70], gods: [24, 40, 24, 40, 110]};

function vibroOn(){ return ('vibrate' in navigator) && localStorage.getItem('1448_vibro') !== '0'; }
function vibro(p){ if (vibroOn()){ try{ navigator.vibrate(p); }catch(e){} } }
function tierName(t){ return STR['tier_' + t] || t; }

async function loadCases(){
  try{
    const d = await api('/me/cases');
    cases = d.cases || [];
    renderCases(); updateCasesBub();
  }catch(e){ /* тихо — обновится при следующем заходе */ }
}
function caseAlive(c){ return !c.opened_at && new Date(c.expires_at) > new Date(); }
function updateCasesBub(){
  const b = document.getElementById('casesBub');
  if (!b) return;
  const n = cases.filter(caseAlive).length;
  b.textContent = n; b.classList.toggle('hidden', n === 0);
}
function renderCases(){
  const el = document.getElementById('casesList');
  if (!el) return;
  if (!cases.length){
    el.innerHTML = `<div class="empty">
      <div class="eic" data-ic="nav-cases"></div>
      <div class="et">${esc(STR.cases_empty_t)}</div>
      <div class="es">${esc(STR.cases_empty_s)}</div></div>`;
    mountIcons(el);
    return;
  }
  el.innerHTML = cases.map(c => {
    const t = TIER[c.tier] || TIER.light;
    const opened = !!c.opened_at;
    const expired = !opened && new Date(c.expires_at) < new Date();
    const days = Math.max(0, Math.ceil((new Date(c.expires_at) - Date.now()) / 86400000));
    let sub;
    if (opened) sub = esc(c.drop_type === 'buster'
      ? T('case_opened_buster', {n: (c.drop_amount || 0) / 100})
      : T('case_opened_coins', {n: fmt(c.drop_amount)}));
    else if (expired) sub = esc(STR.case_expired);
    else sub = esc(STR['case_src_' + c.source] || c.source) +
      ` · <span style="color:${days <= 3 ? 'var(--red)' : 'var(--dim)'}">${esc(T('case_expires', {n: days}))}</span>`;
    const star = (c.tier === 'titan' || c.tier === 'gods') && !opened && !expired; // star-border на Titan/God's
    const dead = opened || expired;
    return `<div class="card case-row ${dead ? 'dead' : ''}" ${dead ? '' : `onclick="openCase('${c.id}')"`}>
      <div class="case-box" style="border:1.5px solid ${t.c}; background:color-mix(in srgb, ${t.c} 13%, transparent)${star ? '; box-shadow:0 0 16px color-mix(in srgb, ' + t.c + ' 45%, transparent)' : ''}">
        <span class="case-em" style="color:${t.c}">${t.em}</span>
        ${star ? '<span class="case-star">★</span>' : ''}
      </div>
      <div style="flex:1; min-width:0">
        <div class="tier-name" style="color:${t.c}">${esc(tierName(c.tier))}</div>
        <div class="muted cnum" style="font-size:12px">${sub}</div>
      </div>
      ${dead ? '' : `<div class="open-hint">${esc(STR.case_open_hint)}</div>`}
    </div>`;
  }).join('');
  mountIcons(el);
}

/* ── открытие: сервер решает дроп ДО анимации ── */
async function openCase(id){
  const c = cases.find(v => v.id === id);
  if (!c || c.opened_at || caseOpening) return;
  if (new Date(c.expires_at) < new Date()){ toast(STR.case_expired_t); loadCases(); return; }
  caseOpening = id;
  const t = TIER[c.tier] || TIER.light;
  const ov = document.getElementById('caseOv');
  const tierEl = document.getElementById('coTier');
  tierEl.textContent = T('co_title', {t: tierName(c.tier)});
  tierEl.style.color = t.c;
  document.getElementById('coPrize').classList.add('hidden');
  const stage = document.getElementById('coStage');
  stage.style.opacity = '1';
  document.getElementById('coReel').style.transform = 'translateX(0)';
  document.getElementById('coReel').innerHTML = '';
  ov.classList.add('show');
  let d;
  try{ d = await api('/me/cases/' + id + '/open', {method: 'POST', body: '{}'}); }
  catch(e){
    caseOpening = null;
    ov.classList.remove('show');
    toast(T('toast_err', {m: e.message}));
    if (e.code === 'already_opened' || e.code === 'expired') loadCases();
    return;
  }
  /* повторное открытие — без перезагрузки списка (М3-и2): правим локально */
  c.opened_at = new Date().toISOString();
  c.drop_type = d.drop_type;
  c.drop_amount = d.drop_amount;
  if (d.user && me) me.coins_balance = d.user.coins_balance;
  renderCases(); updateCasesBub();
  if (FX.lite){ showPrize(d); return; }  // слабое железо / reduced-motion: сразу приз
  requestAnimationFrame(() => runReel(d));
}

/* ячейка реела: редкость = цвет рамки/свечения; красный — top-tier (канон) */
function reelCell(tier, val, buster){
  if (buster) return {c: 'var(--acc2)', label: '+' + val + '%', ic: 'sp'};
  const cfg = CASE_CFG[tier] || CASE_CFG.light;
  let c;
  if (val >= JACKPOT) c = 'var(--t-gods)';
  else {
    const rel = (val - cfg[0]) / Math.max(1, cfg[1] - cfg[0]);
    c = rel < .25 ? 'var(--t-light)' : rel < .6 ? 'var(--t-medium)' : rel < .9 ? 'var(--t-heavy)' : 'var(--t-titan)';
  }
  return {c, label: fmt(val), ic: 'coins'};
}

function runReel(d){
  const stage = document.getElementById('coStage'), reel = document.getElementById('coReel');
  const stageW = stage.getBoundingClientRect().width || 360;
  const CELL = 102;                    // 92 + gap 10
  const N = 46, TARGET = 40;
  const cfg = CASE_CFG[d.tier] || CASE_CFG.light;
  const cells = [];
  for (let i = 0; i < N; i++){
    if (i === TARGET){
      cells.push(d.drop_type === 'buster'
        ? reelCell(d.tier, (d.drop_amount || 0) / 100, true)
        : reelCell(d.tier, d.drop_amount));
      continue;
    }
    const r = Math.random();
    if (r < .05) cells.push(reelCell(d.tier, JACKPOT));
    else if (r < .13) cells.push(reelCell(d.tier, 1 + Math.floor(Math.random() * 3), true));
    else cells.push(reelCell(d.tier, Math.round((cfg[0] + Math.random() * (cfg[1] - cfg[0])) / 5) * 5));
  }
  reel.innerHTML = cells.map(x => `<div class="co-cell" style="border-color:${x.c}; box-shadow:0 0 14px color-mix(in srgb, ${x.c} 28%, transparent)">
    <span style="color:${x.c}; display:flex" data-ic="${x.ic}"></span>
    <div class="v cnum" style="color:${x.c}">${x.label}</div></div>`).join('');
  mountIcons(reel);
  const marker = document.getElementById('coMarker');
  const F = TARGET * CELL + 46 - stageW / 2;  // цель ровно под маркером
  const OVER = 16;                             // перелёт для микро-доката
  const DUR = 5100, t0 = performance.now();
  let lastIdx = -1;
  cancelAnimationFrame(reelRaf);
  function frame(now){
    const p = Math.min(1, (now - t0) / DUR);
    const e = 1 - Math.pow(1 - p, 4);          // мгновенный разгон, долгое торможение
    const off = (F + OVER) * e;
    reel.style.transform = 'translateX(' + (-off) + 'px)';
    const idx = Math.round((off + stageW / 2 - 46) / CELL);
    if (idx !== lastIdx && p > .02){           // тик: вибро + вспышка маркера
      lastIdx = idx;
      vibro(8);
      if (marker){ marker.classList.remove('tick'); void marker.offsetWidth; marker.classList.add('tick'); }
    }
    if (p < 1){ reelRaf = requestAnimationFrame(frame); return; }
    const t1 = performance.now();              // микро-докат назад
    function settle(n2){
      const p2 = Math.min(1, (n2 - t1) / 240);
      const e2 = 1 - Math.pow(1 - p2, 3);
      reel.style.transform = 'translateX(' + (-(F + OVER * (1 - e2))) + 'px)';
      if (p2 < 1){ reelRaf = requestAnimationFrame(settle); return; }
      showPrize(d);
    }
    reelRaf = requestAnimationFrame(settle);
  }
  reelRaf = requestAnimationFrame(frame);
}

function showPrize(d){
  const t = TIER[d.tier] || TIER.light;
  const stage = document.getElementById('coStage');
  if (stage) stage.style.opacity = '0';
  const amt = document.getElementById('coAmt');
  const chest = document.getElementById('coChest');
  chest.innerHTML = UI[d.drop_type === 'buster' ? 'sp' : 'coins'] || '';
  chest.style.color = t.c;
  amt.style.color = t.c;
  if (d.drop_type === 'buster'){
    amt.dataset.v = '';
    amt.textContent = '+' + ((d.drop_amount || 0) / 100) + '%';
    document.getElementById('coWhat').textContent = T('co_buster', {t: tierName(d.tier)});
  } else {
    amt.dataset.v = '0'; amt.textContent = '0';
    document.getElementById('coWhat').textContent =
      (d.drop_amount >= JACKPOT ? STR.co_jackpot + ' · ' : '') + T('co_coins', {t: tierName(d.tier)});
    FX.countUp(amt, d.drop_amount);
  }
  document.getElementById('coPrize').classList.remove('hidden');
  renderTop();                                 // свежие монеты в топбар (count-up)
  vibro(DROP_VIB[d.tier] || [30]);             // дроп-вибро по тиру
  FX.confetti(CONF_N[d.tier] || 30);           // конфетти гуще с тиром
}

function closeCase(){
  cancelAnimationFrame(reelRaf);
  document.getElementById('caseOv').classList.remove('show');
  caseOpening = null;
}

/* настройка «вибро в кейсах» — только там, где есть API (Android) */
function vibroLabel(){
  const b = document.getElementById('vibroBtn');
  if (!b) return;
  if (!('vibrate' in navigator)){ b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  b.textContent = vibroOn() ? STR.set_vibro_on : STR.set_vibro_off;
}
function toggleVibro(){
  localStorage.setItem('1448_vibro', vibroOn() ? '0' : '1');
  if (vibroOn()) vibro(30);
  vibroLabel();
}

/* ═══════════════ М4: ДЕНЬГИ И СВЯЗЬ ═══════════════
   Чат с админом (тред, бэйдж непрочитанных, «Позвать админа» только при
   активной сессии) + уведомления: поллинг 12с (решение №4), тосты очередью
   как в shell, лента-центр во вкладке «Чат». Сервер отдаёт уведомления
   ОДИН раз (помечает при выдаче) — ленту копим на клиенте (сессия
   приложения). Деньги: строка курса и шторка «Пополнить» в Прогрессе. */
let chatMsgs = [], chatView = 'chat', chatUnread = 0, chatBusy = false;
let ntfFeed = [], notifQ = [], notifPumping = false, pollComms = null;

function startComms(){
  stopComms();
  if (document.hidden) return;
  pollComms = setInterval(() => {
    loadNotifs();
    if (curTab === 'chat' && chatView === 'chat') loadChat(); else loadChatUnread();
  }, 12000);
}
function stopComms(){ clearInterval(pollComms); pollComms = null; }

/* ── бэйдж непрочитанных ответов персонала (решение №5) ── */
async function loadChatUnread(){
  try{ chatUnread = (await api('/me/chat/unread')).count || 0; updateChatBub(); }
  catch(e){ /* тихо */ }
}
function updateChatBub(){
  const b = document.getElementById('chatBub');
  if (b){ b.textContent = chatUnread; b.classList.toggle('hidden', !chatUnread); }
}

/* ── тред (М4-и3): mark=1 только когда чат реально на экране ── */
async function loadChat(){
  try{
    const mark = curTab === 'chat' && chatView === 'chat' && !document.hidden;
    const d = await api('/me/chat' + (mark ? '?mark=1' : ''));
    chatMsgs = d.messages || [];
    if (mark && chatUnread){ chatUnread = 0; updateChatBub(); }
    renderChat();
  }catch(e){ /* тихо: поллинг повторит */ }
}
function renderChat(){
  const el = document.getElementById('thread');
  if (!el) return;
  const stick = !el.dataset.did || el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  el.dataset.did = '1';
  if (!chatMsgs.length){
    el.innerHTML = `<div class="empty" style="min-height:120px"><div class="es">${esc(STR.chat_empty)}</div></div>`;
    return;
  }
  el.innerHTML = chatMsgs.map(m => {
    if (m.kind === 'call')
      return `<div class="msg callmsg cnum">🔔 ${esc(STR.chat_call_msg)} · ${hm(m.created_at)}</div>`;
    const who = m.sender === 'guest' ? 'guest' : 'staff';
    return `<div class="msg ${who}">${m.admin ? `<div class="madmin">${esc(m.admin)}</div>` : ''}${esc(m.text)}<div class="mt cnum">${hm(m.created_at)}</div></div>`;
  }).join('');
  if (stick) el.scrollTop = el.scrollHeight;
}
async function sendChat(){
  const inp = document.getElementById('chatInput');
  const text = (inp.value || '').trim();
  if (!text || chatBusy) return;
  chatBusy = true;
  document.getElementById('sendBtn').disabled = true;
  try{
    await api('/me/chat', {method: 'POST', body: JSON.stringify({kind: 'text', text})});
    inp.value = '';
    await loadChat();
  }catch(e){ toast(T('toast_err', {m: e.message})); }
  chatBusy = false;
  document.getElementById('sendBtn').disabled = false;
}
/* вызов админа — только при активной сессии (МOBILE М4-и3) */
async function callAdmin(){
  try{
    await api('/me/chat', {method: 'POST', body: JSON.stringify({kind: 'call', text: ''})});
    toast(STR.chat_call_sent);
    loadChat();
  }catch(e){ toast(T('toast_err', {m: e.message})); } // 429: «Администратор уже позван — идёт»
}
function updateCallBtn(){
  const r = document.getElementById('callRow');
  if (r) r.classList.toggle('hidden', !activeSession);
}
function setChatView(v){
  chatView = v;
  document.getElementById('segChat').classList.toggle('on', v === 'chat');
  document.getElementById('segNtf').classList.toggle('on', v === 'ntf');
  document.getElementById('chatView').classList.toggle('hidden', v !== 'chat');
  document.getElementById('ntfView').classList.toggle('hidden', v !== 'ntf');
  if (v === 'chat') loadChat(); else renderNtf();
}

/* ── уведомления (М4-и2): тосты очередью + лента; данные освежаются сами ── */
async function loadNotifs(){
  let items;
  try{ items = (await api('/me/notifications')).items || []; }
  catch(e){ return; }
  if (!items.length) return;
  items.forEach(n => {
    const txt = ntfText(n);
    ntfFeed.unshift({t: txt, at: n.created_at});
    notifQ.push(txt);
  });
  ntfFeed = ntfFeed.slice(0, 50);
  if (!notifPumping) pumpNotif();
  renderNtf();
  loadMe();
  if (items.some(n => n.type === 'booking_cancel' || n.type === 'booking_restore')) loadBookings();
  if (items.some(n => n.type === 'grant_case')) loadCases();
}
function pumpNotif(){
  if (!notifQ.length){ notifPumping = false; return; }
  notifPumping = true;
  toast(notifQ.shift());
  setTimeout(pumpNotif, 2700);
}
function ntfText(n){
  const p = n.payload || {};
  switch (n.type){
    case 'booking_cancel':
      return STR.ntf_bk_cancel + (p.start_time ? ' · ' + hm(p.start_time) : '') + (p.computer ? ' (' + p.computer + ')' : '');
    case 'booking_restore':
      return STR.ntf_bk_restore + (p.start_time ? ' · ' + hm(p.start_time) : '');
    case 'deposit':
      return T('ntf_deposit', {c: fmt(p.coins || 0), a: p.amount_pln || 0});
    case 'grant_xp':
      return T('ntf_grant_xp', {n: fmt(p.amount || 0)}) + (p.levels_gained > 0 ? T('ntf_grant_xp_lvl', {l: p.level}) : '');
    case 'grant_case':
      return T('ntf_grant_case', {t: tierName(p.tier || '')});
  }
  return STR.ntf_default;
}
function renderNtf(){
  const el = document.getElementById('ntfFeed');
  if (!el) return;
  el.innerHTML = ntfFeed.length
    ? ntfFeed.map(x => `<div class="hrow"><span class="h-when">${esc(fmtWhen(x.at))}</span><span class="h-l" style="white-space:normal">${esc(x.t)}</span></div>`).join('')
    : `<div class="empty" style="min-height:120px"><div class="es">${esc(STR.ntf_empty)}</div></div>`;
}

/* ── деньги (М4-и1): шторка «Пополнить» до Stripe/BLIK ── */

/* ═══════════════ М5: УСТАНОВКА И ПОЛИРОВКА ═══════════════ */
/* version-check поверх SW (RESEARCH §1): iOS агрессивно кэширует sw.js и
   гость может залипнуть на старой версии. Зашитую APP_VER сравниваем с
   app_version из манифеста (fetch no-store); рассинхрон → один
   registration.update() + одна перезагрузка (sessionStorage-предохранитель).
   ПРАВИЛО: при каждой правке app.html поднимать APP_VER здесь и
   app_version в web/app.webmanifest — парой. */
const APP_VER = '2026-07-23.1';
async function checkVersion(){
  if (!location.protocol.startsWith('http')) return;
  try{
    const mf = await (await fetch('/app.webmanifest?v=' + Date.now(), {cache: 'no-store'})).json();
    if (!mf.app_version) return;
    if (mf.app_version === APP_VER){ sessionStorage.removeItem('1448_verload'); return; }
    if (sessionStorage.getItem('1448_verload')) return;   // одна попытка — циклов не будет
    sessionStorage.setItem('1448_verload', '1');
    if ('serviceWorker' in navigator){
      try{
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) await reg.update();
      }catch(e){}
    }
    location.reload();
  }catch(e){ /* офлайн или dev без манифеста — молчим */ }
}

/* установка на экран телефона: Android — родной prompt, если Chrome дал
   beforeinstallprompt (по HTTPS + Richer Install со скриншотами манифеста);
   iOS — инструкция «Поделиться → На экран „Домой“» (iOS 26 ставит любой сайт). */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
function isStandalone(){
  return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
function initInstall(){
  const b = document.getElementById('instBtn');
  if (b && isStandalone()) b.classList.add('hidden');   // уже стоит на экране
}
function openInstall(){
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  document.getElementById('instGo').classList.toggle('hidden', !deferredInstall);
  document.getElementById('instBody').textContent = isStandalone() ? STR.inst_done
    : ios ? STR.inst_ios
    : deferredInstall ? STR.inst_android_native : STR.inst_android;
  document.getElementById('installWrap').classList.add('open');
}
function closeInstall(){ document.getElementById('installWrap').classList.remove('open'); }
async function nativeInstall(){
  const p = deferredInstall;
  deferredInstall = null;
  closeInstall();
  if (!p) return;
  try{ p.prompt(); await p.userChoice; }catch(e){}
}

/* ═══ FX: облегчённый движок (решение №6 — без tilt/spotlight/magnet) ═══ */
const FX = (() => {
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* дебаг-ручка: localStorage 1448_fx = '0' — FX всегда полные, '1' — всегда lite */
  const fxOverride = localStorage.getItem('1448_fx');
  let lite = fxOverride === '1' || (fxOverride !== '0' &&
    (reduced || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2)));
  if (lite) document.body.classList.add('perf-lite');

  // авто-упрощение при низком FPS (замер первые ~2с после входа)
  function watchFPS(){
    if (lite || fxOverride === '0') return;
    let frames = 0, t0 = performance.now();
    function tick(now){
      frames++;
      if (now - t0 >= 2000){
        const fps = frames * 1000 / (now - t0);
        if (fps < 32){ lite = true; document.body.classList.add('perf-lite'); }
        return;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // набегающие числа (как в shell)
  function countUp(el, to){
    if (!el) return;
    to = Number(to) || 0;
    const from = Number(el.dataset.v || 0);
    if (lite || from === to){ el.textContent = to.toLocaleString('ru-RU'); el.dataset.v = to; return; }
    const dur = 550, t0 = performance.now();
    function step(now){
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
      el.textContent = Math.round(from + (to - from) * e).toLocaleString('ru-RU');
      if (p < 1) requestAnimationFrame(step); else el.dataset.v = to;
    }
    requestAnimationFrame(step);
  }

  // пружинная смена контента вкладки (как в shell)
  function swap(el){
    if (lite || !el) return;
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
  }

  // конфетти дропа/левел-апа — красно-белые (перенос из shell, М3-и3)
  function confetti(n){
    if (lite) return;
    const colors = ['#ff2740', '#ff5563', '#ffffff', '#e5133a', '#c9ccd6'];
    for (let i = 0; i < n; i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (40 + Math.random() * 20) + 'vw';
      c.style.top = '34vh';
      c.style.background = colors[i % colors.length];
      c.style.setProperty('--cx', (Math.random() * 60 - 30) + 'vw');
      c.style.setProperty('--dur', (1.1 + Math.random() * 0.8) + 's');
      if (Math.random() > .5) c.style.borderRadius = '50%';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2000);
    }
  }

  // ripple по тапу — тач-замена click-spark
  function ripple(x, y){
    if (lite) return;
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = x + 'px'; r.style.top = y + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 500);
  }

  return { countUp, swap, watchFPS, ripple, confetti, get lite(){ return lite; } };
})();

// глобальный ripple на интерактивных элементах
document.addEventListener('click', e => {
  if (e.target.closest('.btn,.nav button,.tabs button,.chip,.bk-x')) FX.ripple(e.clientX, e.clientY);
});

/* ═══ SERVICE WORKER (установка на главный экран; по чистому http://<ip> молча пропускаем) ═══ */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
