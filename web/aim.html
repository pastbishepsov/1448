<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14:48 · Калибратор</title>
<style>
  /* ═══ С3-и2 (SENS.md, DESIGN.md): язык 14:48 Noir — чёрная база, красный
     #ff2740 как единственный акцент, стекло, системные шрифты шелла. Токены
     скопированы из web/shell.html, чтобы калибратор в оверлее читался как
     часть киоска, а не как отдельный «лабораторный» инструмент. Мяты и янтаря
     прежней палитры не осталось: данные — белый/нейтральный, ответ — красный. */
  :root{
    --bg:#070708; --panel:#0f0f12; --card:#141417; --card2:#1c1c21;
    --txt:#f2f0f2; --dim:#8d8d97; --dimmer:#5d5d66;
    --acc:#ff2740; --acc2:#c9ccd6; --acc3:#ff5563;
    --glass:rgba(20,20,24,.55); --glass-2:rgba(28,28,33,.5);
    --glass-brd:rgba(255,255,255,.08); --glass-hi:rgba(255,60,80,.28); --blur:14px;
    --aurora:linear-gradient(120deg,#ff2740 0%,#ff5563 50%,#7a0f1c 100%);
    --sh-1:0 8px 30px rgba(0,0,0,.45); --sh-2:0 18px 50px rgba(0,0,0,.6);
    --glow:0 0 24px rgba(255,39,64,.45); --glow-2:0 0 30px rgba(255,39,64,.35);
    --hair:rgba(255,255,255,.055);
    --spring:cubic-bezier(.22,1,.36,1); --smooth:cubic-bezier(.4,0,.2,1);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); -webkit-font-smoothing:antialiased; overflow:hidden}
  button{font-family:inherit; cursor:pointer}
  button:focus-visible, input:focus-visible, summary:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}
  /* aurora-фон шелла — статичный: во время замера ничего не плывёт и не грузит GPU,
     на арене (#session) он выключен вовсе */
  .aurora-bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:var(--bg)}
  .aurora-bg .blob{position:absolute; border-radius:50%; filter:blur(80px); opacity:.3; mix-blend-mode:screen}
  .aurora-bg .b1{width:46vw; height:46vw; left:-8vw; top:-12vw; background:radial-gradient(circle,#ff2740,transparent 65%)}
  .aurora-bg .b2{width:42vw; height:42vw; right:-10vw; top:-6vw; background:radial-gradient(circle,#8a0f1c,transparent 65%)}
  .aurora-bg .b3{width:50vw; height:50vw; left:18vw; bottom:-24vw; background:radial-gradient(circle,#4a0a12,transparent 65%)}
  body.in-session .aurora-bg{display:none}
  .screen{position:fixed; inset:0; display:none; z-index:1}
  #setup{overflow-y:auto}
  .screen.on{display:block}
  .center{min-height:100%; display:flex; padding:24px}

  /* ---------- фирменный знак (web/shell.html, docs/ТЗ-логотип-14-48.md) ---------- */
  @keyframes logo1448Pulse{0%{opacity:1}12%{opacity:.22}42%{opacity:1}100%{opacity:1}}
  .logo1448{display:block; flex:none; overflow:visible}
  .logo1448 .l-colon{animation:logo1448Pulse 1s ease-out infinite}

  /* ---------- setup ---------- */
  .card{
    margin:auto; width:min(540px,100%); position:relative;
    background:var(--glass); border:1px solid var(--glass-brd); border-radius:24px; padding:32px 32px 28px;
    box-shadow:var(--sh-2); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur));
  }
  .card::before{content:""; position:absolute; inset:0 0 auto 0; height:1px; border-radius:24px 24px 0 0;
    background:linear-gradient(90deg,transparent,var(--glass-hi),transparent)}
  .head{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .head h1{font-size:22px; font-weight:900; margin:0; letter-spacing:.01em}
  .eyebrow{font-size:12px; font-weight:700; color:var(--dim); margin:0 0 14px}
  .lede{color:var(--dim); font-size:13.5px; line-height:1.55; margin:0 0 20px; max-width:50ch}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--dim); margin-bottom:6px}
  .field .sub{font-size:11.5px; color:var(--dimmer); margin-top:5px}
  .row{display:flex; gap:12px}
  .row .field{flex:1}
  input[type=number], select{
    width:100%; background:rgba(8,8,11,.7); border:1px solid var(--glass-brd); border-radius:12px;
    color:var(--txt); font-family:inherit; font-size:16px; font-weight:700; padding:12px 13px;
    font-variant-numeric:tabular-nums; transition:border-color .2s, box-shadow .2s;
  }
  input[type=number]:hover, select:hover{border-color:rgba(255,255,255,.16)}
  input[type=number]:focus, select:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(255,39,64,.18)}
  select{
    font-size:14px; appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%; background-size:5px 5px; background-repeat:no-repeat;
  }
  select option{background:var(--panel); color:var(--txt)}
  .chk{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; font-weight:600; color:var(--dim)}
  .chk input{accent-color:var(--acc); width:14px; height:14px}
  /* С1-и5: быстрый / точный режим — два пресета параметров сессии */
  .modes{display:flex; gap:10px}
  .mode{flex:1; background:var(--glass-2); border:1px solid var(--glass-brd); border-radius:12px; padding:10px 12px; text-align:left; color:var(--txt);
    transition:border-color .2s, box-shadow .2s, transform .2s var(--spring)}
  .mode:hover{border-color:rgba(255,255,255,.16); transform:translateY(-1px)}
  .mode.on{border-color:var(--acc); box-shadow:var(--glow)}
  .mode b{display:block; font-size:13.5px; font-weight:800; margin-bottom:3px}
  .mode span{font-size:11.5px; color:var(--dim)}
  details{border-top:1px solid var(--hair); margin-top:4px; padding-top:12px}
  summary{font-size:12px; font-weight:700; color:var(--dim); list-style:none; display:flex; align-items:center; gap:8px; user-select:none; cursor:pointer}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+"; color:var(--acc); width:12px; font-weight:800}
  details[open] summary::before{content:"–"}
  .adv{padding-top:16px}
  .slider{margin-bottom:14px}
  .slider .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .slider .top span:first-child{font-size:12px; font-weight:700; color:var(--dim)}
  .slider .val{font-size:14px; font-weight:800; color:var(--txt); font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:3px; background:rgba(255,255,255,.12); border-radius:3px; outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--acc); cursor:pointer; border:3px solid var(--bg); box-shadow:0 0 0 1px var(--acc)}
  input[type=range]::-moz-range-thumb{width:13px; height:13px; border-radius:50%; background:var(--acc); cursor:pointer; border:3px solid var(--bg)}
  /* premium-кнопки шелла: aurora + shimmer + glow; ghost — стекло */
  .btn{position:relative; overflow:hidden; width:100%; border:0; border-radius:14px; padding:15px; font-size:16px; font-weight:700; color:#fff;
    background:var(--aurora); background-size:200% 100%; box-shadow:var(--glow); z-index:0;
    transition:transform .2s var(--spring), box-shadow .25s var(--smooth), background-position .6s var(--smooth)}
  .btn::after{content:""; position:absolute; top:0; left:-60%; width:45%; height:100%; z-index:1;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent); transform:skewX(-18deg)}
  .btn:hover{transform:translateY(-2px) scale(1.015); box-shadow:0 10px 30px rgba(255,39,64,.5), var(--glow-2); background-position:100% 0}
  .btn:hover::after{animation:shimmer .9s var(--smooth)}
  @keyframes shimmer{0%{left:-60%}100%{left:130%}}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--glass-2); box-shadow:none; border:1px solid var(--glass-brd); color:var(--txt)}
  .btn.ghost:hover{border-color:var(--acc); box-shadow:var(--glow)}
  .btn.slim{padding:11px 14px; font-size:14px; border-radius:11px}
  .cta{margin-top:20px}
  .cta.ghost{margin-top:10px}
  .notice{font-size:12px; color:var(--dimmer); line-height:1.6; margin-top:16px; border-left:2px solid var(--hair); padding-left:12px}
  .warnbox{background:rgba(255,39,64,.08); border:1px solid rgba(255,39,64,.3); border-radius:12px; padding:13px 15px; margin-bottom:16px; font-size:12.5px; color:var(--txt); line-height:1.5}

  /* ---------- session ---------- */
  #arena{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:none}
  #session.on #arena{cursor:none}
  .hud{position:absolute; inset:0; pointer-events:none}
  .hud .corner{position:absolute; padding:20px 24px}
  .hud .tl{top:0; left:0}
  .hud .tr{top:0; right:0; text-align:right}
  .hud .label{font-size:10.5px; letter-spacing:.14em; font-weight:700; color:var(--dim); text-transform:uppercase; margin-bottom:5px}
  .hud .big{font-size:18px; font-weight:800; color:var(--txt); font-variant-numeric:tabular-nums}
  .hud .phase{position:absolute; top:22px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.24em; font-weight:800; text-transform:uppercase; color:var(--acc2)}
  .hud .phase.warm{color:var(--acc)}
  .segbar{display:flex; gap:3px; margin-top:9px}
  .seg{width:13px; height:4px; background:rgba(255,255,255,.12); border-radius:2px}
  .seg.done{background:var(--acc2)}
  .seg.cur{background:var(--acc); box-shadow:0 0 8px rgba(255,39,64,.6)}
  .seg.ab{outline:1px solid rgba(255,39,64,.5); outline-offset:-1px}
  .seg.ab.done{background:var(--acc)}
  .prompt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none}
  .prompt .pulse{width:54px; height:54px; margin-bottom:26px; position:relative}
  .prompt .pulse::before,.prompt .pulse::after{content:""; position:absolute; background:var(--txt); opacity:.55}
  .prompt .pulse::before{left:50%; top:14px; bottom:14px; width:1.5px; transform:translateX(-50%)}
  .prompt .pulse::after{top:50%; left:14px; right:14px; height:1.5px; transform:translateY(-50%)}
  .prompt .ring{position:absolute; inset:0; border:1.5px solid var(--acc); border-radius:50%; animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.15);opacity:0}}
  .prompt h2{font-size:24px; font-weight:900; letter-spacing:.06em; margin:0 0 12px}
  .prompt p{font-size:13px; color:var(--dim); margin:0; max-width:46ch; line-height:1.6}
  .prompt.interrupt h2{color:var(--acc)}
  .lockhelp{position:absolute; bottom:34px; left:50%; transform:translateX(-50%); background:rgba(255,39,64,.1); border:1px solid rgba(255,39,64,.35); border-radius:12px; padding:12px 16px; font-size:12px; color:var(--txt); max-width:460px; text-align:center; line-height:1.6; display:none}
  @media (prefers-reduced-motion:reduce){
    .prompt .ring{animation:none; opacity:.4}
    .logo1448 .l-colon{animation:none}
    .btn:hover::after{animation:none}
  }
  /* С0 (SENS.md): внутри шелла (iframe) правый верхний угол занят кнопкой
     «✕ Закрыть калибратор» шелла — HUD-угол опускаем под неё */
  body.embed .hud .tr{top:34px}
  .simbadge{display:none; font-size:10.5px; letter-spacing:.16em; font-weight:800; color:var(--acc);
    border:1px solid rgba(255,39,64,.45); border-radius:8px; padding:3px 8px; margin-left:8px; vertical-align:middle}
  body.sim .simbadge{display:inline-block}

  .exit{position:absolute; right:22px; bottom:20px; pointer-events:auto;
    background:rgba(4,4,6,.75); border:1px solid var(--hair); color:var(--dim); border-radius:12px;
    padding:8px 13px; font-size:12.5px; font-weight:800; transition:color .15s, border-color .15s}
  .exit:hover{color:#fff; border-color:var(--acc)}

  /* ---------- results ---------- */
  #results .wrap{height:100%; overflow-y:auto; padding:40px 24px 60px}
  #results .inner{max-width:840px; margin:0 auto}
  .rhead{display:flex; align-items:center; gap:12px; margin-bottom:8px}
  .rhead h1{font-size:20px; font-weight:900; margin:0}
  .rsub{font-size:12px; color:var(--dim); line-height:1.6; margin:0 0 26px}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px}
  .stat{background:var(--glass); border:1px solid var(--glass-brd); border-radius:14px; padding:18px; box-shadow:var(--sh-1);
    backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur))}
  .stat.hero{border-color:rgba(255,39,64,.45); background:linear-gradient(180deg,rgba(255,39,64,.08),var(--glass))}
  .stat .k{font-size:11px; letter-spacing:.08em; font-weight:700; color:var(--dim); text-transform:uppercase; margin-bottom:10px}
  .stat .v{font-size:32px; font-weight:900; line-height:1; color:var(--txt); font-variant-numeric:tabular-nums}
  .stat.hero .v{color:var(--acc)}
  .stat .u{font-size:13px; font-weight:600; color:var(--dim); margin-left:6px}
  .stat .note{font-size:12px; color:var(--dim); margin-top:10px; line-height:1.5}
  .stat.wide{grid-column:1/-1}
  .stat.verdict{border-color:rgba(255,39,64,.35); background:linear-gradient(180deg,rgba(255,39,64,.06),var(--glass))}
  .stat.verdict.tie{border-color:var(--glass-brd); background:var(--glass)}
  .stat.verdict .v{font-size:21px; line-height:1.35; font-weight:800}
  .vsbar{display:flex; height:7px; border-radius:4px; overflow:hidden; margin-top:14px; background:rgba(255,255,255,.08)}
  .vsbar i{display:block; height:100%; background:var(--acc); box-shadow:0 0 10px rgba(255,39,64,.5)}
  .vsrow{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); margin-top:7px; font-variant-numeric:tabular-nums}
  .chartcard{background:var(--glass); border:1px solid var(--glass-brd); border-radius:14px; padding:20px 18px 12px; margin-bottom:20px; box-shadow:var(--sh-1);
    backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur))}
  .chartcard .ct{font-size:12px; letter-spacing:.06em; font-weight:800; color:var(--dim); text-transform:uppercase; margin-bottom:4px}
  .chartcard .cd{font-size:11.5px; color:var(--dimmer); margin-bottom:12px}
  .legend{display:flex; gap:18px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); margin-top:6px}
  .legend i{display:inline-block; width:18px; height:0; border-top-width:2px; border-top-style:solid; vertical-align:middle; margin-right:7px}
  .chartcard svg{display:block; width:100%; height:auto} /* только график: знак .logo1448 держит свою ширину */
  .caveats summary{padding:14px 0}
  .caveats .body{font-size:13px; color:var(--dim); line-height:1.65; padding-bottom:8px}
  .caveats .body b{color:var(--txt); font-weight:700}
  .caveats .body p{margin:0 0 12px}
  .rbtns{display:flex; gap:10px; margin-top:8px; flex-wrap:wrap}
  .rbtns .btn{flex:1; width:auto; padding:13px; font-size:14px; border-radius:12px}
  .rbtns #saveBtn{flex:1.6}
  .copied{border-color:var(--acc)!important; color:var(--acc)!important}
  /* С4-и2: плитка коуча — перелёт/недолёт подсвечены акцентом, «поровну» нейтральна */
  .stat.coach.over, .stat.coach.under{border-color:rgba(255,39,64,.35)}
  /* С4-и1: строка тёплого старта под режимами */
  .warmbox{display:none; align-items:center; gap:10px; font-size:12px; color:var(--dim); line-height:1.5; margin:-4px 0 14px; padding:10px 12px; border-radius:12px; background:rgba(255,39,64,.06); border:1px solid rgba(255,39,64,.25)}
  .warmbox.on{display:flex}
  .warmbox label{display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer; color:var(--txt); font-weight:600}
  .warmbox input{accent-color:var(--acc); width:14px; height:14px}
  /* С4-и3: экран замера DPI */
  #measure .mres{font-size:30px; font-weight:900; color:var(--acc); margin:14px 0 6px; text-align:center; font-variant-numeric:tabular-nums}
  #measure .mstep{display:none} #measure .mstep.on{display:block}

  /* ---------- calib overlay ---------- */
  #calib{position:fixed; inset:0; background:rgba(4,4,6,.9); display:none; z-index:20; align-items:center; justify-content:center}
  #calib.on{display:flex}
  .calbox{width:min(460px,92%); background:var(--panel); border:1px solid var(--hair); border-radius:24px; padding:28px; text-align:center}
  .calbox h3{font-size:17px; font-weight:800; margin:0 0 6px}
  .calbox p{font-size:12.5px; color:var(--dim); line-height:1.65; margin:0 0 16px}
  .calreadout{font-size:30px; font-weight:900; color:var(--acc); margin:14px 0; font-variant-numeric:tabular-nums}
  .calreadout small{font-size:13px; font-weight:600; color:var(--dim)}
  .calstep{display:none}.calstep.on{display:block}
  .calbox input[type=number]{max-width:160px; margin:0 auto; text-align:center}
  .calbox .btn{margin-top:10px}
</style>
</head>
<body>
<!-- С3-и2: aurora-фон шелла (статичный); С3-и1: все надписи — data-t / data-th из AIM_RU/EN/PL -->
<div class="aurora-bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<!-- ===================== SETUP ===================== -->
<section id="setup" class="screen on">
  <div class="center">
    <div class="card">
      <div class="head">
        <svg class="logo1448" viewBox="-6 -6 328 112" style="height:22px" role="img" aria-label="14:48" focusable="false">
          <g class="l-sand" fill="#ff2740"><path d="M263,83 Q281,62 299,83 Q294,89.5 281,90 Q268,89.5 263,83 Z"/></g>
          <g class="l-digits" fill="none" stroke="#f2f0f2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12,26 L34,9 L34,92"/>
            <path d="M104,10 L60,62 L114,62 M104,10 L104,92"/>
            <path d="M218,10 L174,62 L228,62 M218,10 L218,92"/>
            <path d="M281,50 C258,40 255,10 281,10 C307,10 304,40 281,50 C258,60 255,90 281,90 C307,90 304,60 281,50 Z"/>
          </g>
          <g class="l-colon" fill="#ff2740"><circle cx="143" cy="30" r="12"/><circle cx="143" cy="72" r="12"/></g>
        </svg>
        <h1 data-t="title_h1"></h1><span class="simbadge">SIM</span>
      </div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <p class="lede" data-t="lede"></p>

      <div id="gate" class="warnbox" style="display:none" data-t="gate"></div>

      <div class="row">
        <div class="field">
          <label data-t="f_dpi"></label>
          <input id="dpi" type="number" value="800" min="100" max="32000" step="50">
          <div class="sub" data-t="f_dpi_sub"></div>
        </div>
        <div class="field">
          <label data-t="f_sens"></label>
          <input id="sens" type="number" value="1.00" min="0.05" max="20" step="0.05">
          <div class="sub" data-t="f_sens_sub"></div>
        </div>
      </div>

      <div class="field">
        <label data-t="f_res"></label>
        <select id="aspect">
          <option value="1.25" selected>1280×1024 · 5:4</option>
          <option value="1.3333">4:3 · 1280×960 / 1024×768</option>
          <option value="1.6">16:10</option>
          <option value="1.7778" data-t="opt_169"></option>
        </select>
        <div class="sub" style="margin-top:9px"><label class="chk"><input id="stretch" type="checkbox" checked> <span data-t="f_stretch"></span></label></div>
      </div>

      <div class="field">
        <label data-t="f_mode"></label>
        <div class="modes">
          <button type="button" class="mode" data-mode="quick"><b data-t="mode_quick"></b><span data-t="mode_quick_sub"></span></button>
          <button type="button" class="mode" data-mode="precise"><b data-t="mode_precise"></b><span data-t="mode_precise_sub"></span></button>
        </div>
        <div class="sub" id="modeEst"></div>
      </div>
      <div class="warmbox" id="warmbox"><span id="warmText"></span><label><input id="warmOn" type="checkbox" checked> <span data-t="warm_use"></span></label></div>

      <details>
        <summary data-t="adv"></summary>
        <div class="adv">
          <div class="slider"><div class="top"><span data-t="s_rounds"></span><span class="val" id="vRounds">14</span></div><input id="rounds" type="range" min="6" max="22" value="14"></div>

function cholesky(A){const n=A.length,L=Array.from({length:n},()=>new Float64Array(n));

      const tm=mean(t); let num=0,den=0;
      for(let i=0;i<n;i++){num+=(t[i]-tm)*r[i];den+=(t[i]-tm)*(t[i]-tm);}
      let b=den>1e-9?num/den:0; b*=0.8;
      const span=Math.max(...Y)-Math.min(...Y)||1;
      b=clamp(b,-0.6*span,0.6*span); trend=b;
      Y=Y.map((y,i)=>y-b*(t[i]-1));
    }
    return {gp:fitGP(this.X,Y,this.ell,this.sf2,this._noise()),Yadj:Y,trend};
  }
  _bo(){const {gp}=this._fit();let best=null;
    for(const g of this.grid){const p=gp.predict(g);const lcb=p.mean-this.kappa*p.sd;if(!best||lcb<best.lcb)best={x:g,lcb};}return best.x;}
  posterior(){const {gp,Yadj,trend}=this._fit();
    const curve=this.grid.map(g=>{const p=gp.predict(g);return {logs:g,sens:Math.pow(10,g),mean:p.mean,sd:p.sd};});
    let rec=curve[0]; for(const c of curve)if(c.mean<rec.mean)rec=c;
    // optimum interval: mean within rec.mean + 0.5*sd
    const thr=rec.mean+Math.max(rec.sd*0.5,1e-6); let lo=rec.sens,hi=rec.sens;
    for(const c of curve)if(c.mean<=thr){lo=Math.min(lo,c.sens);hi=Math.max(hi,c.sens);}
    const samples=this.X.map((x,i)=>({sens:Math.pow(10,x),cost:Yadj[i],order:i+1}));
    let yMin=Infinity,yMax=-Infinity; for(const c of curve){yMin=Math.min(yMin,c.mean-1.6*c.sd);yMax=Math.max(yMax,c.mean+1.6*c.sd);}
    for(const s of samples){yMin=Math.min(yMin,s.cost);yMax=Math.max(yMax,s.cost);}
    return {curve,rec,samples,lo,hi,yMin,yMax,trend};}
}

/* ---------------- config / state ---------------- */
const VFOV=73.74; // CS2 vertical FOV, aspect-independent
const cfg={dpi:800,sens:1,pxPerCm:800/2.54,rounds:14,flicks:12,warmup:3,targetRad:2.2,
  aspect:1.25,aspectLabel:"1280×1024",stretch:true,range:2.6,abRounds:4};
let opt=null;
const st={mode:"idle",running:false,phase:"idle",roundIndex:0,testN:1,S:0.022,
  warmupLeft:0,scoredLeft:0,flickLog:[],queue:[],flickIdx:-1,plannedD:0,actualD:0,
  activeAt:0,moveT:0,moveAcc:0,hits:0,misses:0,spawnTime:0,endingNormally:false,
  abMode:false,abQueue:[],abTotal:0,abData:[],
  calSum:0,lockTimer:null,missFlash:0};
const SESSION={set:[],rtAll:[],mtAll:[],miss1All:[],missDir:[]}; // missDir — С4-и2: over|under|side на первый промах флика
let yaw=0,pitch=0;
let target={az:0,el:0};

/* canonical flick set: same D/direction battery for EVERY round (blocked design) —
   each sensitivity sits the same exam, so between-round luck cancels out */
function buildFlickSet(n){
  // widest flick must stay ON SCREEN for the chosen aspect: at 5:4 half-hFOV is only 43.15°
  const halfH=Math.atan(Math.tan(VFOV*RAD/2)*cfg.aspect)*DEG;
  const dMax=Math.min(50,halfH-cfg.targetRad-3);
  const dMin=Math.min(11,dMax*0.35);
  SESSION.dMax=dMax;
  const set=[],half=Math.ceil(n/2);
  for(let i=0;i<n;i++){
    const side=i%2===0?1:-1;                 // balanced L/R
    const rank=Math.floor(i/2)+0.5;
    const d=dMin+(rank/half)*(dMax-dMin);    // evenly spread, always visible
    const th=(((i*53)%19)-9);                // deterministic vertical tilt −9..+9°
    set.push({d,side,th});
  }
  return set;
}
function totalRounds(){return cfg.rounds+st.abTotal;}

/* sens <-> trainer rotation; under measured pxPerCm so the arena FEELS like CS2 */
function sensToS(N){return 0.022*N*cfg.dpi/(cfg.pxPerCm*2.54);}
function cm360(N){return SENS_CONST/(N*cfg.dpi);}

/* ---------------- canvas / projection ---------------- */
const canvas=$("arena"); const ctx=canvas.getContext("2d");
let W=0,H=0,cx=0,cy=0,fx=400,fy=400,dpr=1,vp={x:0,y:0,w:0,h:0};
/* CS2 renders vFOV=73.74° always; hFOV follows the game aspect ratio.
   stretched: game hFOV is mapped across the FULL canvas width -> anamorphic fx≠fy,
   exactly reproducing 4:3/5:4-stretched visuals (wider targets, faster horizontal flow).
   not stretched: uniform projection inside a pillarboxed viewport. */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const hf=2*Math.atan(Math.tan(VFOV*RAD/2)*cfg.aspect);
  let vw=W,vh=H,ox=0,oy=0;
  if(!cfg.stretch){
    vw=Math.min(W,H*cfg.aspect); vh=Math.min(H,W/cfg.aspect);
    ox=(W-vw)/2; oy=(H-vh)/2;
  }
  vp={x:ox,y:oy,w:vw,h:vh};
  fx=(vw/2)/Math.tan(hf/2); fy=(vh/2)/Math.tan(VFOV*RAD/2);
  cx=ox+vw/2; cy=oy+vh/2;
}
window.addEventListener("resize",resize);
function dir(az,el){const a=az*RAD,e=el*RAD;return [Math.cos(e)*Math.sin(a),Math.sin(e),Math.cos(e)*Math.cos(a)];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function project(az,el){
  const f=dir(yaw,pitch), v=dir(az,el);
  const r=norm(cross([0,1,0],f)); const u=cross(f,r);
  const zc=dot(v,f); if(zc<=0.05)return {vis:false};
  const x=cx+fx*dot(v,r)/zc, y=cy-fy*dot(v,u)/zc;
  return {x,y,zc,vis:x>vp.x-60&&x<vp.x+vp.w+60&&y>vp.y-60&&y<vp.y+vp.h+60};
}
function angDist(az,el){const d=clamp(dot(dir(yaw,pitch),dir(az,el)),-1,1);return Math.acos(d)*DEG;}

function spawnWarm(){
  const minOff=14, maxOff=SESSION.dMax||38;
  let oa=(Math.random()*2-1)*maxOff; if(Math.abs(oa)<minOff)oa+=Math.sign(oa||1)*minOff;
  let oe=(Math.random()*2-1)*maxOff*0.36;
  target.az=yaw+oa; target.el=clamp(pitch+oe,-46,46);
  armFlick();
}
function spawnScored(){
  const fi=st.queue.pop(); const f=SESSION.set[fi];
  let del=f.d*Math.sin(f.th*RAD);
  if(Math.abs(pitch+del)>42)del=-del;             // keep pitch in play, same |D|
  target.az=yaw+f.side*f.d*Math.cos(f.th*RAD);
  target.el=clamp(pitch+del,-46,46);
  st.flickIdx=fi; st.plannedD=f.d;
  armFlick();
}
/* 120 ms pause: target NOT drawn and inert — hand settles from previous kill,
   then the target appears and reaction/onset are measured from that moment.
   (С1-и3: раньше цель была видна полупрозрачной, и тот, кто стартовал в паузу,
   получал фору — тем большую, чем выше сенса.) */
function armFlick(){
  const now=performance.now();
  st.activeAt=now+120; st.spawnTime=st.activeAt;
  st.moveT=0; st.moveAcc=0; st.actualD=0; st.shots=0;
  st.startYaw=yaw; st.startPitch=pitch; // С4-и2: откуда начался флик — ось для коуча
}
/* С4-и2: куда ушёл первый промах относительно оси флика (старт → цель):
   проекция взгляда на ось; дальше цели на радиус — «перелёт», ближе — «недолёт»,
   иначе промах вбок. Чистая функция: гоняется в смоуке без захвата. */
function missDirection(sy,sp,ty,tp,cy,cp,rad){
  const ax=wrap(ty-sy), ay=tp-sp, L2=ax*ax+ay*ay; if(L2<1e-6)return "side";
  const p=(wrap(cy-sy)*ax+(cp-sp)*ay)/L2, tol=rad/Math.sqrt(L2);
  return p>1+tol?"over":p<1-tol?"under":"side";
}

/* ---------------- render loop ---------------- */
let raf=null;
function loop(){
  ctx.fillStyle="#070708"; ctx.fillRect(0,0,W,H);
  // world grid (motion cues)
  ctx.lineWidth=1;
  const yb=Math.round(yaw/10)*10;
  for(let g=yb-80;g<=yb+80;g+=10){
    const p1=project(g,pitch-46),p2=project(g,pitch+46);
    if(p1.vis||p2.vis){ctx.strokeStyle="rgba(201,204,214,.09)";ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
  }
  const pb=Math.round(pitch/10)*10;
  for(let g=pb-50;g<=pb+50;g+=10){
    const p1=project(yaw-70,g),p2=project(yaw+70,g);
    if(p1.vis||p2.vis){ctx.strokeStyle=g===0?"rgba(201,204,214,.18)":"rgba(201,204,214,.06)";ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
  }
  // target (ellipse: anamorphic projection stretches it exactly like stretched-res CS2)
  if(st.running){
    const p=project(target.az,target.el);
    if(p.vis&&performance.now()>=st.activeAt){ // С1-и3: в 120-мс паузе цели нет вовсе
      const t=Math.tan(cfg.targetRad*RAD)/p.zc;
      let rx=fx*t, ry=fy*t;
      if(ry<6){const s=6/ry;rx*=s;ry=6;}
      const warm=st.phase==="warmup";
      ctx.save();
      // С3-и2: цель — белая с красным свечением и красным кольцом (разогрев — серая)
      ctx.shadowBlur=18; ctx.shadowColor=warm?"rgba(141,141,151,.45)":"rgba(255,39,64,.6)";
      ctx.fillStyle=warm?"rgba(141,141,151,.5)":"rgba(242,240,242,.92)";
      ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,0,0,7);ctx.fill();
      ctx.shadowBlur=0;
      ctx.lineWidth=1.5;ctx.strokeStyle=warm?"rgba(201,204,214,.6)":"rgba(255,39,64,.9)";
      ctx.beginPath();ctx.ellipse(p.x,p.y,rx+3,ry+3,0,0,7);ctx.stroke();
      ctx.fillStyle="rgba(7,7,8,.85)";ctx.beginPath();ctx.ellipse(p.x,p.y,Math.max(2,rx*0.18),Math.max(2,ry*0.18),0,0,7);ctx.fill();
      ctx.restore();
    }
  }
  // pillarbox bars when not stretched
  if(vp.w<W-1||vp.h<H-1){
    ctx.fillStyle="#030304";
    if(vp.x>0){ctx.fillRect(0,0,vp.x,H);ctx.fillRect(vp.x+vp.w,0,W-vp.x-vp.w,H);}
    if(vp.y>0){ctx.fillRect(0,0,W,vp.y);ctx.fillRect(0,vp.y+vp.h,W,H-vp.y-vp.h);}
    ctx.strokeStyle="rgba(255,255,255,.08)";ctx.lineWidth=1;
    ctx.strokeRect(vp.x+.5,vp.y+.5,vp.w-1,vp.h-1);
  }
  // miss flash
  if(st.missFlash>0){
    const a=st.missFlash*0.25;
    const grd=ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.3,cx,cy,Math.max(W,H)*0.7);
    grd.addColorStop(0,"rgba(255,39,64,0)");grd.addColorStop(1,"rgba(255,39,64,"+a+")");
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    st.missFlash-=0.08;
  }
  // crosshair
  const g=5,l=11;
  ctx.lineWidth=1.5;ctx.strokeStyle="rgba(242,240,242,.85)";
  ctx.beginPath();
  ctx.moveTo(cx-g-l,cy);ctx.lineTo(cx-g,cy);ctx.moveTo(cx+g,cy);ctx.lineTo(cx+g+l,cy);
  ctx.moveTo(cx,cy-g-l);ctx.lineTo(cx,cy-g);ctx.moveTo(cx,cy+g);ctx.lineTo(cx,cy+g+l);
  ctx.stroke();
  ctx.fillStyle="#ff2740";ctx.beginPath();ctx.arc(cx,cy,1.6,0,7);ctx.fill();
  raf=requestAnimationFrame(loop);
}

/* ---------------- input ---------------- */
document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement==null)return;
  if(st.mode==="calib"){st.calSum+=Math.abs(e.movementX);const v=Math.round(st.calSum);$("calPx").textContent=v;if(MEASURE)$("mPx").textContent=v;return;}
  if(!st.running)return;
  yaw+=e.movementX*st.S;
  pitch=clamp(pitch-e.movementY*st.S,-70,70);
  // movement onset: reaction ends, motor phase begins
  if(st.phase==="scored"&&!st.moveT){
    const now=performance.now();
    if(now>=st.activeAt){
      st.moveAcc+=Math.abs(e.movementX)+Math.abs(e.movementY);
      if(st.moveAcc>=5){st.moveT=now;st.actualD=angDist(target.az,target.el);}
    }
  }
});
document.addEventListener("mousedown",e=>{
  if(st.mode!=="game"||!st.running||document.pointerLockElement!==canvas)return;
  if(e.button!==0)return;
  shoot(performance.now());
});
/* С1-и2: выстрел. Кулдаун 150 мс — очередь кликов «пока не попаду» больше не
   выигрывает время (цель висит до попадания, промах и так удлиняет флик);
   промах до первого попадания помечает флик miss1 — «точность первого
   выстрела» в результате. Вынесено из обработчика, чтобы гонять без захвата. */
const COOLDOWN=150;
function shoot(now){
  if(now<st.activeAt)return "ghost";           // пауза: клики инертны, без штрафа
  if(now-st.lastShot<COOLDOWN)return "cooldown";
  st.lastShot=now;
  let out;
  if(angDist(target.az,target.el)<=cfg.targetRad){
    if(st.phase==="warmup"){
      st.warmupLeft--;
      if(st.warmupLeft<=0){st.phase="scored";spawnScored();}
      else spawnWarm();
    } else {
      const mt=now-(st.moveT||st.spawnTime);
      const rt=st.moveT?st.moveT-st.spawnTime:0;
      const D=Math.max(4,st.actualD||st.plannedD);         // distance measured at movement onset
      const id=Math.log2(D/(cfg.targetRad*2)+1);           // Fitts ID, bits
      st.flickLog.push({mt,rt,id,fi:st.flickIdx,miss1:st.shots>0});
      st.hits++; st.scoredLeft--;
      if(st.scoredLeft<=0){endRound();return "hit";}
      spawnScored();
    }
    out="hit";
  } else {
    if(st.phase==="scored"){st.misses++; if(st.shots===0)SESSION.missDir.push(missDirection(st.startYaw,st.startPitch,target.az,target.el,yaw,pitch,cfg.targetRad));}
    st.shots++; st.missFlash=1; out="miss";
  }
  updateHUD();
  return out;
}
/* С1-и6: частота опроса мыши — считаем сырые события за окна по 250 мс и
   держим максимум (когда мышь стоит, событий нет — минимум не показателен).
   pointerrawupdate — по событию на каждый отчёт мыши; нет его — coalesced. */
function hzTick(now,n){
  const b=Math.floor(now/250);
  if(b!==st.hzBucket){
    if(st.hzCount>0){const r=Math.round(st.hzCount*4/25)*25; if(r>(st.hz||0)){st.hz=r;paintInput();}}
    st.hzBucket=b; st.hzCount=0;
  }
  st.hzCount+=n;
}
if("onpointerrawupdate" in document){
  document.addEventListener("pointerrawupdate",e=>{ if(document.pointerLockElement&&st.running)hzTick(performance.now(),1); });
} else {
  document.addEventListener("pointermove",e=>{ if(document.pointerLockElement&&st.running)hzTick(performance.now(),e.getCoalescedEvents?Math.max(1,e.getCoalescedEvents().length):1); });
}
$("session").addEventListener("click",()=>{
  if(st.mode==="game"&&!st.running) startRound();
});
/* выход: кнопка в углу или Esc (когда захват уже отпущен). С1-и4: если
   раундов поиска уже ≥ 6 — результат по ним (с честной пометкой «прервано»),
   а не пустые руки; меньше — в настройки. */
const PARTIAL_MIN=6;
function exitSession(){
  st.endingNormally=true; st.running=false;
  if(document.pointerLockElement)document.exitPointerLock();
  if(raf){cancelAnimationFrame(raf);raf=null;}
  const done=Math.min(st.roundIndex,cfg.rounds);
  if(st.mode==="game"&&opt&&done>=PARTIAL_MIN){
    st.partial=done<cfg.rounds?done:0;
    showResults(); return;
  }
  st.mode="idle";
  showScreen("setup");
}
$("exitBtn").addEventListener("click",e=>{e.stopPropagation();exitSession();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&st.mode==="game"&&!document.pointerLockElement)exitSession();
});

/* ---------------- pointer lock ---------------- */
/* С1-и1: raw input. Обычный захват отдаёт движение ПОСЛЕ акселерации и
   ползунка скорости Windows — cm/360 плыл, замер зависел от настроек ОС.
   Chromium/WebView2 (с 88-й) умеют {unadjustedMovement:true} — сырые счётчики
   мыши, 1 count = 1 px, свайп-калибровка не нужна. Не дали (старый движок,
   Firefox) — обычный захват, и результат честно говорит «через курсор». */
let rawTry=false, lockEl=null;
function lockPointer(el){
  lockEl=el; rawTry=true;
  let p=null;
  try{ p=el.requestPointerLock({unadjustedMovement:true}); }catch(e){ p=null; rawTry=false; }
  if(p&&typeof p.then==="function"){
    p.then(()=>{st.raw=true;paintInput();},()=>lockFallback());
  } else if(!rawTry){ lockFallback(); }
}
function lockFallback(){
  rawTry=false; st.raw=false; paintInput();
  try{ (lockEl||canvas).requestPointerLock(); }catch(e){}
}
document.addEventListener("pointerlockerror",()=>{ if(rawTry)lockFallback(); });
function paintInput(){
  const s=(st.raw===true?t("raw_on"):st.raw===false?t("raw_off"):"")+(st.hz?(st.raw==null?"":" · ")+st.hz+" "+t("u_hz"):"");
  const el=$("hInput"); if(el)el.textContent=s;
  const m=$("mInput"); if(m)m.textContent=s; // С4-и3: то же на экране замера
}
document.addEventListener("pointerlockchange",()=>{
  const locked=document.pointerLockElement!=null;
  if(locked&&rawTry&&st.raw!==false){st.raw=true;paintInput();}
  if(st.mode==="calib"){
    if(!locked){ // user pressed Esc -> finalize swipe
      if(MEASURE)measureDone(); else if(st.calSum>40){showCalStep(3);}
    }
    return;
  }
  if(locked){ // game round actually begins
    clearTimeout(st.lockTimer); $("lockhelp").style.display="none";
    st.running=true; st.endingNormally=false; armFlick();
    setPhase(); $("prompt").style.display="none";
  } else {
    if(st.running && !st.endingNormally){ // interrupted mid-round
      st.running=false; st.phase="interrupted";
      showPrompt(t("interrupted"),t("interrupted_sub"),true);
      updateHUD();
    }
  }
});

/* ---------------- round lifecycle ---------------- */
function startRound(){
  if(st.roundIndex>=totalRounds()){showResults();return;}
  st.abMode=st.roundIndex>=cfg.rounds;
  st.testN=st.abMode?st.abQueue[st.roundIndex-cfg.rounds]:opt.nextSens();
  st.S=sensToS(st.testN);
  st.phase=cfg.warmup>0?"warmup":"scored";
  st.warmupLeft=cfg.warmup; st.scoredLeft=cfg.flicks;
  st.queue=shuffle(SESSION.set.map((_,i)=>i));
  st.flickLog=[];st.hits=0;st.misses=0;st.missFlash=0;
  yaw=0;pitch=0;
  if(st.phase==="warmup")spawnWarm(); else spawnScored();
  updateHUD(); $("prompt").style.display="none";
  st.lastShot=-1e9; st.shots=0;
  lockPointer(canvas);
  clearTimeout(st.lockTimer);
  st.lockTimer=setTimeout(()=>{if(document.pointerLockElement!==canvas)$("lockhelp").style.display="block";},700);
}
/* after BO rounds: decide whether a blind A/B validation block is worth running */
function prepareAB(){
  if(cfg.abRounds<2){st.abTotal=0;return;}
  const P=opt.posterior();
  const rec=P.rec.sens, cur=cfg.sens;
  if(Math.abs(Math.log(rec/cur))<0.03){st.abTotal=0;st.abSkipClose=true;return;} // <3% apart: nothing to verify — the current sens IS the optimum
  const pairs=cfg.abRounds/2, q=[];
  for(let i=0;i<pairs;i++)q.push(rec,cur);
  st.abQueue=shuffle(q); st.abTotal=st.abQueue.length; st.abRecN=rec;
}
function endRound(){
  st.endingNormally=true; document.exitPointerLock(); st.running=false;
  const per=st.flickLog.map(f=>f.mt/f.id);      // ms per bit (Fitts-normalized)
  const cost=median(per);
  const se=1.2533*1.4826*mad(per)/Math.sqrt(Math.max(1,per.length)); // SE of the median
  for(const f of st.flickLog){if(f.rt>0)SESSION.rtAll.push(f.rt);SESSION.mtAll.push(f.mt);SESSION.miss1All.push(f.miss1?1:0);}
  if(st.abMode){
    st.abData.push({sens:st.testN,per,byFi:st.flickLog.map(f=>({fi:f.fi,c:f.mt/f.id}))});
  } else {
    opt.record(st.testN,cost,se);
  }
  st.roundIndex++; st.phase="done";
  if(st.roundIndex===cfg.rounds)prepareAB();
  updateHUD();
  if(st.roundIndex>=totalRounds()){
    showPrompt(t("session_done"),t("computing"),false);
    setTimeout(showResults,450);
  } else if(st.roundIndex===cfg.rounds&&st.abTotal>0){
    showPrompt(t("ab_phase"),t("ab_intro",{n:pl(st.abTotal,"ab_rounds")}),false);
  } else {
    const hzNote=st.hz&&st.hz<250?t("hz_note",{hz:st.hz}):"";
    showPrompt(t("round_done",{n:pad(st.roundIndex)}),t("round_next")+hzNote,false);
  }

function showResults(){
  st.mode="idle"; if(document.pointerLockElement)document.exitPointerLock();
  if(raf){cancelAnimationFrame(raf);raf=null;}
  showScreen("results");
  const P=opt.posterior();
  const recN=st.abRecN||P.rec.sens, recCm=cm360(recN), curN=cfg.sens, curCm=cm360(curN);
  const dPct=(recN-curN)/curN*100;
  const dir2=dPct>=0?"up":"dn";
  const dWord=Math.abs(dPct)<1.5?t("ch_same"):(dPct>0?t("ch_up"):t("ch_dn"));
  // confidence from posterior flatness. С3-и1: наружу (aim_result.conf) уходит
  // код high|mid|low, а не слово на языке экрана — шелл/сервер хранят код.
  const rel=P.rec.sd/Math.max(1e-6,(P.yMax-P.yMin));
  const conf=st.partial?"low":rel<0.07?"high":rel<0.16?"mid":"low";
  const acc1=SESSION.miss1All.length?Math.round(100*(1-mean(SESSION.miss1All))):null; // С1-и2
  // С4-и2: коуч без LLM — куда уходит первый промах вдоль оси флика.
  // Перелёт преобладает → сенса высоковата; недолёт → низковата; поровну —
  // дело не в сенсе. Судим, когда промахов ≥ 4 и перевес ≥ 65 % при ≥ 3.
  const md=SESSION.missDir, over=md.filter(d=>d==="over").length, under=md.filter(d=>d==="under").length, side=md.length-over-under;
  let coach="none", coachText;
  if(md.length<4)coachText=t("coach_few",{n:md.length});
  else if(over>=3&&over>=0.65*(over+under)){coach="over";coachText=t("coach_over",{n:md.length,k:over});}
  else if(under>=3&&under>=0.65*(over+under)){coach="under";coachText=t("coach_under",{n:md.length,k:under});}
  else coachText=t("coach_none");
  // reaction / motor split + throughput
  const avgRT=SESSION.rtAll.length?Math.round(mean(SESSION.rtAll)):0;
  const avgMT=SESSION.mtAll.length?Math.round(mean(SESSION.mtAll)):0;
  const tp=P.rec.mean>0?(1000/P.rec.mean).toFixed(2):"—";
  // learning trend note
  const trendNote=Math.abs(P.trend)>3?`<span style="color:var(--acc2)">${t("trend_note",{s:(P.trend<0?"−":"+")+Math.abs(P.trend).toFixed(0)})}</span>`:t("trend_none");
  // A/B verdict (paired across the fixed flick set); verdictKey — для шелла:
  // rec — рекомендация выиграла, cur — текущая, tie — разницы нет (или
  // рекомендация совпала с текущей и A/B не понадобился), none — не проверяли
  let abHTML="", verdictKey=st.abSkipClose?"tie":"none", gainPct=0;
  if(st.abData.length>=2){
    const grp={rec:[],cur:[]};
    for(const d of st.abData){
      const key=Math.abs(Math.log(d.sens/recN))<Math.abs(Math.log(d.sens/curN))?"rec":"cur";
      grp[key].push(d);
    }
    if(grp.rec.length&&grp.cur.length){
      const collect=g=>{const by={};for(const d of g)for(const x of d.byFi){(by[x.fi]=by[x.fi]||[]).push(x.c);}return by;};
      const bR=collect(grp.rec), bC=collect(grp.cur);
      let wins=0,pairs=0;
      for(const fi in bR)if(bC[fi]){pairs++;if(mean(bR[fi])<mean(bC[fi]))wins++;}
      const medR=median(grp.rec.flatMap(d=>d.per)), medC=median(grp.cur.flatMap(d=>d.per));
      const gain=(medC-medR)/medC*100;
      const share=pairs?wins/pairs:0.5;
      let verdict,tie=false; gainPct=gain;
      if(share>=0.7&&gain>2){verdict=t("v_faster",{g:gain.toFixed(1)});verdictKey="rec";}
      else if(share>=0.58&&gain>0){verdict=t("v_slightly",{g:gain.toFixed(1)});verdictKey="rec";}
      else if(share<=0.3&&gain<-2){verdict=t("v_current",{g:(-gain).toFixed(1)});verdictKey="cur";}
      else {verdict=t("v_tie");tie=true;verdictKey="tie";}
      const pR=Math.round(share*100);
      abHTML=`<div class="stat wide verdict${tie?" tie":""}">
        <div class="k">${t("ab_title",{n:pl(st.abData.length,"rounds_gen")})}</div>
        <div class="v">${verdict}</div>
        <div class="vsbar"><i style="width:${pR}%"></i></div>
        <div class="vsrow"><span>${t("ab_rec",{s:recN.toFixed(2),c:medR.toFixed(0),w:wins,p:pairs})}</span><span>${t("ab_cur",{s:curN.toFixed(2),c:medC.toFixed(0)})}</span></div>
      </div>`;
    }
  }

  const keepCur=verdictKey==="cur"||verdictKey==="tie"; // подтверждена текущая — подставлять нечего
  const inputNote=st.raw===true?t("raw_on"):st.raw===false?t("raw_off"):t("raw_none");
  $("resultsInner").innerHTML=`
    <div class="rhead">${LOGO}<h1>${t("r_title")}</h1></div>
    <p class="rsub">${st.partial?`<span style="color:var(--acc)">${t("r_partial",{n:pl(st.partial,"rounds_loc"),m:cfg.rounds})}</span> · `:`${t("r_rounds",{n:pl(cfg.rounds,"rounds_gen")})} · `}${cfg.aspectLabel}${cfg.stretch?" "+t("r_stretched"):""} · DPI ${cfg.dpi} · ${t("r_target",{d:cfg.targetRad.toFixed(1)})} · ${inputNote}${st.hz?" · "+st.hz+" "+t("u_hz"):""} · ${t("r_conf",{c:t("conf_"+conf)})}${cfg.warm?" · "+t("r_warm",{s:cfg.warmSens.toFixed(2)}):""} · ${trendNote}</p>
    <div class="stats">
      ${abHTML}
      <div class="stat hero">
        <div class="k">${t("k_rec")}</div>
        <div class="v">${recN.toFixed(2)}</div>
        <div class="note">${t("rec_range",{lo:P.lo.toFixed(2),hi:P.hi.toFixed(2)})}</div>
      </div>
      <div class="stat">
        <div class="k">${t("k_cm")}</div>
        <div class="v">${recCm.toFixed(1)}<span class="u">${t("u_cm")}</span></div>
        <div class="note">${t("now_cm",{cm:curCm.toFixed(1)})}</div>
      </div>
      <div class="stat">
        <div class="k">${t("k_change")}</div>
        <div class="v ${dir2}">${dPct>=0?"+":""}${dPct.toFixed(0)}<span class="u">%</span></div>
        <div class="note">${dWord}</div>
      </div>
      <div class="stat wide" style="display:flex;gap:34px;flex-wrap:wrap;align-items:baseline">
        <div><div class="k">${t("k_rt")}</div><div class="v" style="font-size:22px">${avgRT||"—"}<span class="u">${t("u_ms")}</span></div></div>
        <div><div class="k">${t("k_mt")}</div><div class="v" style="font-size:22px">${avgMT||"—"}<span class="u">${t("u_ms")}</span></div></div>
        <div><div class="k">${t("k_tp")}</div><div class="v" style="font-size:22px">${tp}<span class="u">${t("u_bits")}</span></div></div>
        <div><div class="k">${t("k_acc1")}</div><div class="v" style="font-size:22px">${acc1==null?"—":acc1}<span class="u">%</span></div></div>
        <div class="note" style="flex:1;min-width:200px;margin-top:0">${t("metric_note")}</div>
      </div>
      <div class="stat wide coach ${coach}">
        <div class="k">${t("coach_title")} · ${t("coach_counts",{o:over,u:under,s:side})}</div>
        <div class="note" style="margin-top:0;font-size:13px;color:var(--txt)">${coachText}</div>
      </div>
    </div>
    <div class="chartcard">
      <div class="ct">${t("chart_t")}</div>
      <div class="cd">${t("chart_d")}</div>
      ${buildChart(P,recN,curN)}
      <div class="legend">
        <span><i style="border-color:var(--txt)"></i>${t("lg_model")}</span>
        <span><i style="border-color:rgba(255,255,255,.35);border-top-style:dotted"></i>${t("lg_band")}</span>
        <span><i style="border-color:var(--acc);border-top-style:dashed"></i>${t("lg_opt")}</span>
        <span><i style="border-color:var(--dim);border-top-style:dashed"></i>${t("lg_cur")}</span>
      </div>
    </div>
    <details class="caveats">
      <summary>${t("cav_title")}</summary>
      <div class="body">
        <p>${t("cav_how")}</p>
        <p>${t("cav_adapt")}</p>
        <p>${t("cav_task")}</p>
        <p>${t("cav_cal")}${cfg.calibrated?t("cav_cal_swipe"):st.raw===true?t("cav_cal_raw"):t("cav_cal_11")}</p>
        <p>${t("cav_do")}${keepCur
          ?t("cav_do_keep",{s:curN.toFixed(2)})+(EMBED?t("cav_do_keep_embed"):"")
          :t("cav_do_set",{s:recN.toFixed(2)})+(EMBED?t("cav_do_set_embed"):"")}</p>
      </div>
    </details>
    <div class="rbtns">
      ${EMBED?`<button class="btn" id="saveBtn">${keepCur?t("btn_keep"):t("btn_apply")}</button>`:""}
      <button class="btn ghost" id="copyBtn">${t("btn_copy",{s:(keepCur?curN:recN).toFixed(2)})}</button>
      <button class="btn ghost" id="redoBtn">${t("btn_redo")}</button>
      ${EMBED?`<button class="btn ghost" id="closeBtn">${t("btn_close")}</button>`:""}
    </div>`;
  $("copyBtn").addEventListener("click",e=>{
    navigator.clipboard&&navigator.clipboard.writeText((keepCur?curN:recN).toFixed(2));
    e.target.textContent=t("btn_copied"); e.target.classList.add("copied");

function buildChart(P,recN,curN){
  const w=800,h=340,m={l:54,r:18,t:18,b:42};
  const iw=w-m.l-m.r, ih=h-m.t-m.b;
  const lx=v=>m.l+(Math.log10(v)-opt.logMin)/(opt.logMax-opt.logMin)*iw;
  const pad=(P.yMax-P.yMin)*0.08||10;
  const y0=P.yMin-pad, y1=P.yMax+pad;
  const ly=v=>m.t+(1-(v-y0)/(y1-y0))*ih;
  // band
  let top="",bot="";
  P.curve.forEach((c,i)=>{const x=lx(c.sens);top+=(i?"L":"M")+x.toFixed(1)+" "+ly(c.mean+1.6*c.sd).toFixed(1)+" ";});
  for(let i=P.curve.length-1;i>=0;i--){const c=P.curve[i];const x=lx(c.sens);bot+="L"+x.toFixed(1)+" "+ly(c.mean-1.6*c.sd).toFixed(1)+" ";}
  const band=top+bot+"Z";
  // mean line
  let mean=""; P.curve.forEach((c,i)=>{mean+=(i?"L":"M")+lx(c.sens).toFixed(1)+" "+ly(c.mean).toFixed(1)+" ";});
  // x ticks
  // x ticks: края и текущая; значение оптимума пишет его красная подпись (С3-и2: раньше две подписи ложились друг на друга)
  const ticks=[opt.logMin,Math.log10(curN),opt.logMax].map(v=>Math.pow(10,v));
  let xax="";
  [...new Set(ticks.map(tv=>tv.toFixed(2)))].forEach(ts=>{const tv=parseFloat(ts);const x=lx(tv);
    xax+=`<line x1="${x}" y1="${m.t}" x2="${x}" y2="${m.t+ih}" stroke="rgba(255,255,255,.05)"/>
    <text x="${x}" y="${h-16}" fill="#8d8d97" font-size="11" text-anchor="middle">${ts}</text>`;});
  // y ticks
  let yax="";
  for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;const y=ly(v);
    yax+=`<line x1="${m.l}" y1="${y}" x2="${m.l+iw}" y2="${y}" stroke="rgba(255,255,255,.05)"/>
    <text x="${m.l-9}" y="${y+4}" fill="#8d8d97" font-size="11" text-anchor="end">${Math.round(v)}</text>`;}
  // samples
  let pts="";
  P.samples.forEach(s=>{const x=lx(s.sens),y=ly(s.cost);
    pts+=`<g><line x1="${x-4}" y1="${y}" x2="${x+4}" y2="${y}" stroke="#8d8d97" stroke-width="1.3"/>
    <line x1="${x}" y1="${y-4}" x2="${x}" y2="${y+4}" stroke="#8d8d97" stroke-width="1.3"/>
    <text x="${x+7}" y="${y-6}" fill="#5d5d66" font-size="9">${s.order}</text></g>`;});
  // current marker
  const xc=lx(curN);
  // optimum marker
  const xo=lx(recN), yo=ly(P.rec.mean);
  // С3-и2: модель — белая, неопределённость — стекло, оптимум — акцент, текущая — приглушённая
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${t("chart_aria")}">
    ${yax}${xax}
    <path d="${band}" fill="rgba(255,255,255,.06)" stroke="none"/>
    <path d="${mean}" fill="none" stroke="#f2f0f2" stroke-width="2"/>
    <line x1="${xc}" y1="${m.t}" x2="${xc}" y2="${m.t+ih}" stroke="#8d8d97" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="${xc}" y="${m.t+12}" fill="#8d8d97" font-size="10" text-anchor="middle">${t("chart_now")}</text>
    <line x1="${xo}" y1="${m.t}" x2="${xo}" y2="${m.t+ih}" stroke="#ff2740" stroke-width="1.3" stroke-dasharray="5 4"/>
    <circle cx="${xo}" cy="${yo}" r="5.5" fill="none" stroke="#ff2740" stroke-width="2"/>
    <line x1="${xo-9}" y1="${yo}" x2="${xo+9}" y2="${yo}" stroke="#ff2740" stroke-width="1.3"/>
    <line x1="${xo}" y1="${yo-9}" x2="${xo}" y2="${yo+9}" stroke="#ff2740" stroke-width="1.3"/>
    <text x="${xo}" y="${m.t+ih+30}" fill="#ff2740" font-size="11" font-weight="800" text-anchor="middle">${t("chart_opt",{s:recN.toFixed(2)})}</text>
    ${pts}
  </svg>`;
}

    <line x1="${xo}" y1="${m.t}" x2="${xo}" y2="${m.t+ih}" stroke="#ff2740" stroke-width="1.3" stroke-dasharray="5 4"/>
    <circle cx="${xo}" cy="${yo}" r="5.5" fill="none" stroke="#ff2740" stroke-width="2"/>
    <line x1="${xo-9}" y1="${yo}" x2="${xo+9}" y2="${yo}" stroke="#ff2740" stroke-width="1.3"/>
    <line x1="${xo}" y1="${yo-9}" x2="${xo}" y2="${yo+9}" stroke="#ff2740" stroke-width="1.3"/>
    <text x="${xo}" y="${m.t+ih+30}" fill="#ff2740" font-size="11" font-weight="800" text-anchor="middle">${t("chart_opt",{s:recN.toFixed(2)})}</text>
    ${pts}
  </svg>`;
}

/* ---------------- calibration ---------------- */
function showCalStep(n){["cs1","cs2","cs3"].forEach((id,i)=>$(id).classList.toggle("on",i===n-1));
  if(n===3){const cm=parseFloat($("calCm").value)||20;const k=(st.calSum/cm)/(cfg.dpi/2.54);$("calK").textContent=t("cal_k",{k:k.toFixed(2),px:Math.round(st.calSum),cm});}}
$("calBtn").addEventListener("click",e=>{e.preventDefault();$("calib").classList.add("on");showCalStep(1);});
$("calCancel").addEventListener("click",()=>$("calib").classList.remove("on"));
$("calGo").addEventListener("click",()=>{
  cfg.dpi=clamp(parseFloat($("dpi").value)||800,100,32000);
  st.mode="calib"; st.calSum=0; $("calPx").textContent="0"; showCalStep(2);
  lockPointer($("calib").requestPointerLock?$("calib"):document.body);
});
$("calRetry").addEventListener("click",()=>{st.calSum=0;showCalStep(1);});
$("calApply").addEventListener("click",()=>{
  const cm=parseFloat($("calCm").value)||20;
  cfg.pxPerCm=st.calSum/cm; cfg.calibrated=true;
  const k=cfg.pxPerCm/(cfg.dpi/2.54);
  $("calStatus").textContent=t("cal_status1",{k:k.toFixed(2)});
  st.mode="idle"; $("calib").classList.remove("on");
});

/* ---------------- live slider labels + gate ---------------- */
const sl=(id,vid,fmt)=>{const i=$(id),o=$(vid);const u=()=>o.textContent=fmt(i.value);i.addEventListener("input",u);u();};
sl("rounds","vRounds",v=>v);
sl("flicks","vFlicks",v=>v);
sl("target","vTarget",v=>(v/10).toFixed(1)+"°");
sl("ab","vAb",v=>v==="0"||v===0?t("off"):v);
sl("range","vRange",v=>"×"+(v/10).toFixed(1));
if(!window.matchMedia("(pointer: fine)").matches){$("gate").style.display="block";}

/* С1-и5 (Р3: время за ПК платное): два пресета. «Быстро» — по умолчанию,
   8 раундов × 8 фликов + 2 контрольных, ≈3 мин; «Точно» — прежние 14 × 12 +
   4, ≈7 мин. Ползунки под «Параметрами сессии» остаются; сдвинул — «свои
   параметры». Оценка минут считается из параметров, не зашита. */
const MODES={quick:{rounds:8,flicks:8,ab:2,range:20},precise:{rounds:14,flicks:12,ab:4,range:26}};
function estMin(){const r=warmOn()?warmRounds(+$("rounds").value):+$("rounds").value,f=+$("flicks").value,a=+$("ab").value;return Math.max(1,Math.round(((r+a)*(cfg.warmup+f)*1.35+(r+a)*3)/60));}
/* С4-и1: тёплый старт. ?warm_cm= — cm/360 прошлого оптимума (шелл берёт из
   GET /me/aim-sessions). Раундов ¾, но не меньше 6 (быстрый 8 → 6, точный 14 → 10),
   диапазон ×1.6 вместо ×2.0–2.6: GP не тратит раунды на края. */
const WARM_CM=parseFloat(Q.get("warm_cm"))||0, WARM_RANGE=1.6;
function warmSensAt(dpi){return WARM_CM>0?SENS_CONST/(WARM_CM*dpi):0;}
function warmRounds(r){return Math.max(6,Math.floor(r*0.75));}
function warmOn(){return WARM_CM>0&&$("warmOn").checked;}
function paintWarm(){
  const box=$("warmbox"); box.classList.toggle("on",WARM_CM>0); if(!(WARM_CM>0))return;
  const dpi=clamp(parseFloat($("dpi").value)||800,100,32000), s=warmSensAt(dpi);
  $("warmText").textContent=t("warm_line",{s:s.toFixed(2),cm:WARM_CM.toFixed(1),n:pl(warmRounds(+$("rounds").value),"rounds_gen")});
}
$("warmOn").addEventListener("change",()=>{paintWarm();paintMode();});
$("dpi").addEventListener("input",paintWarm);
function paintMode(){
  const cur=Object.keys(MODES).find(k=>Object.entries(MODES[k]).every(([id,v])=>+$(id).value===v))||null;
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.mode===cur));
  $("modeEst").textContent=(cur?"":t("mode_custom"))+t("mode_est",{n:estMin()});
  cfg.mode=cur||"custom";
}
function setMode(k){for(const [id,v] of Object.entries(MODES[k])){$(id).value=v;$(id).dispatchEvent(new Event("input"));}paintMode();}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
["rounds","flicks","ab","range"].forEach(id=>$(id).addEventListener("input",paintMode));
$("rounds").addEventListener("input",paintWarm);
setMode(Q.get("mode")==="precise"?"precise":"quick"); // ?mode= — шелл/тест
paintWarm();

/* ═══ 14:48 мост (С0, SENS.md) ═══
   aim.html?embed=1&dpi=&sens=&lang=&aspect=  — открыт iframe'ом из студии сенсы шелла
   (lang — язык словарей AIM_RU/EN/PL, С3-и1; aspect — соотношение сторон CS2 с ПК, С2-и2):
   префилл DPI и текущей сенсы (уже в единицах CS2 — шелл конвертирует сам),
   результат и кнопки уходят parent'у через postMessage:
     {type:'aim_result', sens, dpi, cm360, lo, hi, conf, verdict: rec|cur|tie|none,
      gain_pct, rt_ms, mt_ms, tp, cur, cur_cm, rounds, ab_rounds, sim, acc1, raw, hz,
      partial, mode, lang, coach: over|under|none, warm}; conf — код high|mid|low (С3-и1), не слово
     {type:'aim_save'}  — «подставить в студию и сохранить в аккаунт»
     {type:'aim_close'} — закрыть оверлей
     {type:'aim_dpi', dpi, dpi_raw, counts, cm, raw} — замер DPI свайпом (С4-и3, ?measure=1)
   ?warm_cm=N — тёплый старт от прошлого оптимума (С4-и1, из GET /me/aim-sessions)
   Без embed (файл открыт сам по себе) сообщения уходят в пустоту — безвредно.
   ?sim=1&seed=N&simopt=K&autostart=1 — синтетический стрелок (С0-и4): весь
   конвейер раунды → GP → A/B → вердикт → postMessage без pointer lock; K —
   истинный оптимум в долях от текущей сенсы (1.0 = «текущая и есть оптимум»). */
// Q и EMBED объявлены в начале скрипта (С3-и1: нужны applyLang до остального)
function post(msg){ if(!EMBED)return; try{parent.postMessage(msg,"*");}catch(e){} }
if(EMBED)document.body.classList.add("embed");
(function(){
  const d=parseFloat(Q.get("dpi")), s=parseFloat(Q.get("sens"));
  if(d)$("dpi").value=d; if(s)$("sens").value=s;
  // С2-и2: разрешение CS2 с этого ПК (шелл берёт его у агента) — выбираем то же соотношение
  const a=Q.get("aspect"); if(a&&[...$("aspect").options].some(o=>o.value===a))$("aspect").value=a;
})();

/* ═══ С4-и3 (SENS.md, №13): замер DPI свайпом — aim.html?measure=1&pad_cm=&lang= ═══
   Гость со своей мышью, DPI которой не знает. С raw input 1 отсчёт = 1 px,
   значит DPI = отсчёты / см × 2,54. Эталон длины — коврик клуба (pad_cm из
   настройки mousepad_cm), лист A4 по короткой стороне (21 см) или своя длина.
   Результат снапится к типовым DPI (в пределах 6 %), иначе округляется до 50.
   Наружу: {type:'aim_dpi', dpi, dpi_raw, counts, cm, raw}. */
const MEASURE=Q.get("measure")==="1", PAD_CM=parseFloat(Q.get("pad_cm"))||0;
const DPI_COMMON=[400,500,600,800,1000,1200,1600,2000,2400,3200,4000,6400,8000];
function snapDPI(v){let best=0,bd=1e9;for(const c of DPI_COMMON){const d=Math.abs(v-c)/c;if(d<bd){bd=d;best=c;}}return bd<=0.06?best:Math.max(50,Math.round(v/50)*50);}
let mLen=PAD_CM>0?"pad":"a4", mDpi=0, mRaw=0;
function mLenCm(){return mLen==="pad"?PAD_CM:mLen==="a4"?21:clamp(parseFloat($("mCustom").value)||21,5,100);}
function mStep(n){["ms1","ms2","ms3"].forEach((id,i)=>$(id).classList.toggle("on",i===n-1));}
function paintLens(){
  const opts=[];
  if(PAD_CM>0)opts.push(["pad",t("m_pad",{n:PAD_CM})]);
  opts.push(["a4",t("m_a4")],["custom",t("m_custom")]);
  $("mLens").innerHTML=opts.map(([k,l])=>`<button type="button" class="mode${mLen===k?" on":""}" data-len="${k}"><b>${l}</b></button>`).join("");
  $("mLens").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{mLen=b.dataset.len;paintLens();}));
}
function measureDone(){
  st.mode="idle";
  const cm=mLenCm(), counts=st.calSum;
  if(counts<200){ $("mWarn1").textContent=t("m_short"); $("mWarn1").style.display="block"; mStep(1); return; }
  mRaw=counts/cm*2.54; mDpi=snapDPI(mRaw);
  $("mRes").textContent=t("m_result",{raw:Math.round(mRaw),dpi:mDpi});
  $("mResSub").textContent=t("m_result_sub",{px:Math.round(counts),cm,input:st.raw===true?t("raw_on"):t("raw_off")});
  $("mWarn").style.display=st.raw===true?"none":"block"; $("mWarn").textContent=t("m_noraw");
  $("mUse").textContent=t("m_use",{dpi:mDpi});
  mStep(3);
}
if(MEASURE){
  $("mHead").insertAdjacentHTML("afterbegin",LOGO);
  paintLens(); mStep(1); showScreen("measure");
  $("mGo").addEventListener("click",()=>{ $("mWarn1").style.display="none"; st.mode="calib"; st.calSum=0; $("mPx").textContent="0"; mStep(2); lockPointer($("measure")); });
  $("mRetry").addEventListener("click",()=>mStep(1));
  $("mUse").addEventListener("click",()=>post({type:"aim_dpi",dpi:mDpi,dpi_raw:Math.round(mRaw),counts:Math.round(st.calSum),cm:mLenCm(),raw:st.raw===true}));
  [$("mClose1"),$("mClose3")].forEach(b=>b.addEventListener("click",()=>post({type:"aim_close"})));
}

/* ---------------- симуляция (только для проверки конвейера) ----------------
   Стрелок: MT = (a + b(N)·ID)·skill·шум, где b(N) — U-образная в log-сенсе с
   минимумом в SIM.opt (в единицах CS2), skill растёт за сессию (эффект
   обучения — то, что вычитает детренд), шум лог-нормальный. Math.random
   подменяется seeded PRNG (mulberry32), чтобы прогон был воспроизводим. */
const SIM={on:Q.get("sim")==="1", seed:parseInt(Q.get("seed")||"1"), optK:parseFloat(Q.get("simopt")||"1.6"),
  a:110, b0:95, k:8, sd:0.14, learn:0.12, rtm:210, rts:30, opt:1, stop:parseInt(Q.get("simstop")||"0")};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function simFlick(N,id,progress){
  const x=Math.log10(N/SIM.opt);
  const b=SIM.b0*(1+SIM.k*x*x);
  const skill=1-SIM.learn*progress;
  const mt=Math.max(80,(SIM.a+b*id)*skill*Math.exp(gauss()*SIM.sd));
  const rt=Math.max(120,SIM.rtm+gauss()*SIM.rts);
  const miss1=Math.random()<0.12+0.25*Math.min(1,x*x*6); // первый выстрел чаще мимо вдали от оптимума
  // С4-и2: сенса выше оптимума → рука перелетает (75 %), ниже → недолетает; 15 % — вбок
  const dir=Math.random()<0.15?"side":((x>0)===(Math.random()<0.75)?"over":"under");
  return {mt,rt,miss1,dir};
}
function simRound(){
  if(st.roundIndex>=totalRounds()){showResults();return;}
  st.abMode=st.roundIndex>=cfg.rounds;
  st.testN=st.abMode?st.abQueue[st.roundIndex-cfg.rounds]:opt.nextSens();
  st.S=sensToS(st.testN);
  st.phase="scored"; st.scoredLeft=cfg.flicks; st.flickLog=[]; st.hits=0; st.misses=0;
  st.queue=shuffle(SESSION.set.map((_,i)=>i));
  const progress=totalRounds()>1?st.roundIndex/(totalRounds()-1):1;
  while(st.queue.length){
    const fi=st.queue.pop(), f=SESSION.set[fi];
    const id=Math.log2(f.d/(cfg.targetRad*2)+1);
    const {mt,rt,miss1,dir}=simFlick(st.testN,id,progress);
    if(miss1)SESSION.missDir.push(dir);
    st.flickLog.push({mt,rt,id,fi,miss1}); st.hits++;
  }
  st.running=false;
  endRound(); // запись раунда, A/B-очередь, экран результата в конце
  if(SIM.stop&&st.roundIndex>=SIM.stop&&st.roundIndex<totalRounds()){setTimeout(exitSession,0);return;} // ?simstop=N: гость вышел посреди сессии
  if(st.roundIndex<totalRounds())setTimeout(simRound,0);
}
if(SIM.on){
  document.body.classList.add("sim");
  Math.random=mulberry32(SIM.seed);
  SIM.opt=(parseFloat($("sens").value)||1)*SIM.optK;
  if(Q.get("autostart")==="1")setTimeout(()=>$("startBtn").click(),50);
}
</script>
</body>
